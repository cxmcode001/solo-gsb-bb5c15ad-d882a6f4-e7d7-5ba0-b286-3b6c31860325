services:
  blade-crack-api:
    build: .
    image: blade-crack-api:latest
    container_name: blade-crack-api
    ports:
      - "8000:8000"
    environment:
      # 容器内 SQLite 数据库路径（首次启动自动建表初始化）
      DB_PATH: /data/cracks.db
      # 可选：等级范围（默认 1~4）
      GRADE_MIN: "1"
      GRADE_MAX: "4"
    volumes:
      - blade-crack-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  blade-crack-data:
